[package]
name = "potspot-api"
version = "0.1.0"
edition = "2021"
description = "PotSpot -- Community cannabis strain catalog API"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["macros", "multipart"] }
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "limit", "validate-request", "normalize-path"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "migrate"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Auth
jsonwebtoken = "9"
argon2 = "0.5"
sha2 = "0.10"

# IDs and time
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# HTTP client (OAuth, external calls)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Object storage (MinIO / S3)
rust-s3 = { version = "0.35", features = ["tokio-rustls-tls"], default-features = false }

# Image processing
image = { version = "0.25", features = ["webp"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Config
dotenvy = "0.15"

# Error handling
thiserror = "1"
anyhow = "1"

# URL handling
url = "2"

# Random
rand = "0.8"

# Async trait
async-trait = "0.1"

[dev-dependencies]
axum-test = "15"
tower = { version = "0.4", features = ["util"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
