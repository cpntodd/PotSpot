services:
  api:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.api
    ports:
      - "3000:3000"
    volumes:
      - ../backend:/app
      - cargo-cache:/usr/local/cargo/registry
    environment:
      DATABASE_URL: postgres://potspot:potspot_dev@db:5432/potspot
      JWT_SECRET: dev-secret-change-in-production
      JWT_REFRESH_SECRET: dev-refresh-secret-change-in-production
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: potspot-photos
      RUST_LOG: debug
      RUST_BACKTRACE: 1
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    command: cargo watch -x run

  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: potspot
      POSTGRES_PASSWORD: potspot_dev
      POSTGRES_DB: potspot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U potspot"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - miniodata:/data
    command: server /data --console-address :9001
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/potspot-photos;
      mc anonymous set download local/potspot-photos;
      "

volumes:
  pgdata:
  miniodata:
  cargo-cache:
