<!DOCTYPE html>

<title>PotSpot - Bud Icon</title>
<style>

*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Space Mono',monospace;padding:40px 20px}
h1,h2{font-family:'VT323',monospace;color:var(--text-heading)}

.row{display:flex;align-items:flex-end;gap:24px;margin:24px 0;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:24px;text-align:center}
.label{font-size:.72rem;color:var(--text-muted);margin-top:8px}
